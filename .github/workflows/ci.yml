name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          # CPU-only PyTorch: the default wheel pulls in several GB of CUDA libraries.
          pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check src scripts tests api/main.py migrations/env.py

      - name: Migrations apply to an empty database
        env:
          FRAUD_DATABASE_URL: sqlite:///ci.db
        run: alembic upgrade head

      # The PaySim data is not in the repository, so tests marked "data"
      # (train/serve parity on held-out rows) skip themselves here. Everything
      # else, including the API tests against the registered model, runs.
      - name: Tests
        run: pytest --cov=fraud --cov-report=term-missing

  stack:
    # The whole system from a clean clone: PostgreSQL, the API with two
    # workers, and the dashboard, exactly as docker-compose.yml starts them.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and start the stack
        run: docker compose up -d --build --wait --wait-timeout 600

      - name: The API reports PostgreSQL and a loaded model
        run: |
          curl -fsS http://localhost:8000/status | python3 -c "
          import json, sys
          status = json.load(sys.stdin)
          assert status['status'] == 'ok', status
          assert status['database']['backend'] == 'postgresql', status['database']
          print('model', status['model']['version'], 'database', status['database'])
          "

      - name: A transaction can be scored end to end
        run: |
          curl -fsS -X POST http://localhost:8000/score/raw -H "Content-Type: application/json" -d '{
            "step": 300, "type": "TRANSFER", "amount": 181.0, "nameOrig": "C_ci_sender",
            "oldbalanceOrg": 181.0, "newbalanceOrig": 0.0, "nameDest": "C_ci_recipient",
            "oldbalanceDest": 0.0, "newbalanceDest": 0.0}'

      - name: The dashboard is served
        run: curl -fsS http://localhost:5173/ > /dev/null

      - name: Logs (on failure)
        if: failure()
        run: docker compose logs

      - name: Stop
        if: always()
        run: docker compose down -v

# Render blueprint for the public demo API and its PostgreSQL database.
# See docs/DEPLOY.md. Render reads this file when you create a "Blueprint"
# from the GitHub repository.

services:
  - type: web
    name: fraud-api
    runtime: docker
    plan: free
    dockerfilePath: ./api/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: FRAUD_ENVIRONMENT
        value: production
      - key: FRAUD_DEMO_MODE
        value: "true"
      - key: FRAUD_JWT_SECRET
        generateValue: true          # Render creates a random secret
      - key: FRAUD_DATABASE_URL
        fromDatabase:
          name: fraud-db
          property: connectionString
      - key: FRAUD_CORS_ORIGINS
        sync: false                  # you enter the dashboard's address (step 3 of DEPLOY.md)
      - key: FRAUD_RATE_LIMIT_PER_MINUTE
        value: "300"
      - key: WEB_CONCURRENCY
        value: "1"                   # the free plan has 512 MB of memory

databases:
  - name: fraud-db
    plan: free
    databaseName: fraud
    user: fraud

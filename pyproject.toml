[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fraud"
version = "0.2.0"
description = "Cost-aware fraud detection: shared feature, model and evaluation code for the notebooks, scripts and API"
requires-python = ">=3.12"
dependencies = [
    "numpy==2.5.3",
    "pandas==3.0.5",
    "pyarrow==25.0.1",
    "scipy==1.18.1",
    "scikit-learn==1.9.1",
    "lightgbm==4.7.0",
    "torch==2.14.1",
    "shap==0.52.0",
    "joblib==1.6.0",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "fastapi==0.141.1",
    "uvicorn==0.52.4",
    "SQLAlchemy==2.0.52",
    "alembic==1.19.2",
    "PyJWT==2.15.1",
    "websockets==16.1.1",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "pytest-cov", "ruff==0.16.10", "httpx==0.28.1"]
postgres = ["psycopg[binary]>=3.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["data: needs the PaySim data files on disk (skipped when they are missing)"]

[tool.ruff]
line-length = 130
src = ["src"]
extend-exclude = ["notebooks", "fraud_env", "dashboard"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]   # FastAPI's Depends() in argument defaults is the framework idiom

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E501"]
